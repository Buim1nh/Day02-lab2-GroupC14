<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <text x="500" y="50" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#F8FAFC" letter-spacing="1">
    BẢNG TÓM TẮT VẤN ĐỀ VÀ GIẢI PHÁP: AI AGENT PHÂN TÍCH VOD TFT
  </text>
  <line x1="50" y1="70" x2="950" y2="70" stroke="#334155" stroke-width="2" />

  <rect x="50" y="90" width="900" height="95" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
  <rect x="50" y="90" width="120" height="95" fill="#38BDF8" rx="8" />
  <rect x="160" y="90" width="10" height="95" fill="#1E293B" /> 
  <text x="110" y="142" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0F172A">PROBLEM</text>
  
  <text x="190" y="125" font-family="sans-serif" font-size="14" fill="#F1F5F9">
    Việc tự nghiên cứu VOD của tuyển thủ mất nhiều thời gian nhưng hiệu suất tiếp thu thấp do người xem
  </text>
  <text x="190" y="148" font-family="sans-serif" font-size="14" fill="#F1F5F9">
    chỉ quan sát được bề nổi thao tác (mua bán, xếp bài) mà thiếu đi dữ liệu bối cảnh toàn diện để hiểu
  </text>
  <text x="190" y="171" font-family="sans-serif" font-size="14" fill="#F1F5F9">
    rõ tư duy logic đằng sau các quyết định chiến thuật đột ngột.
  </text>

  <rect x="50" y="205" width="440" height="150" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1" />
  <text x="70" y="235" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38BDF8">ĐỐI TƯỢNG &amp; BỐI CẢNH</text>
  <text x="70" y="265" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94A3B8">Actor:</text>
  <text x="125" y="265" font-family="sans-serif" font-size="14" fill="#F1F5F9">Game thủ TFT có nhu cầu nghiên cứu</text>
  <text x="70" y="285" font-family="sans-serif" font-size="14" fill="#F1F5F9">chiến thuật và nâng cao kỹ năng.</text>
  <text x="70" y="315" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94A3B8">Bối cảnh:</text>
  <text x="145" y="315" font-family="sans-serif" font-size="14" fill="#F1F5F9">Phân tích meta và tự học hỏi qua</text>
  <text x="70" y="335" font-family="sans-serif" font-size="14" fill="#F1F5F9">các nền tảng phát sóng video.</text>

  <rect x="510" y="205" width="440" height="150" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1" />
  <text x="530" y="235" font-family="sans-serif" font-size="16" font-weight="bold" fill="#F87171">NÚT THẮT &amp; TÁC ĐỘNG</text>
  <text x="530" y="265" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94A3B8">Bottleneck:</text>
  <text x="615" y="265" font-family="sans-serif" font-size="14" fill="#F1F5F9">Tua video thủ công thiếu chính xác,</text>
  <text x="530" y="285" font-family="sans-serif" font-size="14" fill="#F1F5F9">dễ lỡ thao tác, lãng phí thời gian.</text>
  <text x="530" y="315" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94A3B8">Metric:</text>
  <text x="585" y="315" font-family="sans-serif" font-size="14" fill="#10B981">Giảm thời gian từ 40 phút xuống &lt; 5 phút.</text>
  <text x="530" y="335" font-family="sans-serif" font-size="14" fill="#10B981">Tỷ lệ trích xuất đúng mốc quan trọng &gt; 90%.</text>

  <rect x="50" y="375" width="900" height="130" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1" />
  <text x="70" y="405" font-family="sans-serif" font-size="16" font-weight="bold" fill="#A78BFA">LUỒNG CÔNG VIỆC HIỆN TẠI (CURRENT WORKFLOW)</text>
  
  <rect x="70" y="425" width="150" height="60" rx="4" fill="#334155" />
  <text x="145" y="450" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#F8FAFC">1. Tìm kiếm &amp;</text>
  <text x="145" y="470" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#F8FAFC">mở video VOD</text>

  <line x1="230" y1="455" x2="260" y2="455" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="270" y="425" width="150" height="60" rx="4" fill="#334155" />
  <text x="345" y="450" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#F8FAFC">2. Tua qua các</text>
  <text x="345" y="470" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#F8FAFC">vòng đầu (đánh quái)</text>

  <line x1="430" y1="455" x2="460" y2="455" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="470" y="425" width="170" height="60" rx="4" fill="#7F1D1D" stroke="#F87171" stroke-width="1" />
  <text x="555" y="450" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#FECACA">3. Dừng căn chỉnh mốc</text>
  <text x="555" y="470" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#FECACA">quan trọng (3-2, 4-2)</text>

  <line x1="650" y1="455" x2="680" y2="455" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="690" y="425" width="170" height="60" rx="4" fill="#7F1D1D" stroke="#F87171" stroke-width="1" />
  <text x="775" y="450" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#FECACA">4. Quan sát, ghi chép</text>
  <text x="775" y="470" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#FECACA">thao tác &amp; tư duy</text>
  
  <text x="555" y="500" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#F87171">▲ BOTTLENECK</text>
  <text x="775" y="500" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#F87171">▲ BOTTLENECK</text>

  <rect x="50" y="525" width="900" height="145" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <rect x="50" y="525" width="120" height="145" fill="#10B981" rx="8" />
  <rect x="160" y="525" width="10" height="145" fill="#1E293B" />
  <text x="110" y="590" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#022C22">GIẢ THUYẾT</text>
  <text x="110" y="610" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#022C22">AI AGENT</text>

  <circle cx="200" cy="565" r="4" fill="#10B981" />
  <text x="215" y="570" font-family="sans-serif" font-size="15" fill="#F1F5F9">
    Triển khai AI Agent kết hợp Computer Vision liên tục theo dõi toàn bộ biến số trên màn hình 
  </text>
  <text x="215" y="590" font-family="sans-serif" font-size="15" fill="#F1F5F9">
    (lượng vàng, chuỗi thắng/thua, trang bị trên hàng chờ, thông tin trinh sát đối thủ).
  </text>
  
  <circle cx="200" cy="625" r="4" fill="#10B981" />
  <text x="215" y="630" font-family="sans-serif" font-size="15" fill="#F1F5F9">
    Suy luận ngược (reverse engineer) để lý giải hành vi, tự động xuất chú giải phân tích nguyên nhân.
  </text>
  <text x="215" y="650" font-family="sans-serif" font-size="14" font-style="italic" fill="#94A3B8">
    Ví dụ: Giải thích lý do roll cạn tiền ở vòng 3-2 thay vì giữ lợi tức đến 4-1 dựa trên trạng thái sảnh đấu.
  </text>
</svg>
