<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 350">
  <rect width="100%" height="100%" fill="#F9FAFB"/>

  <text x="475" y="30" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1F2937">
    BẢNG SO SÁNH CÁC CÔNG CỤ VÀ GIẢI PHÁP TƯƠNG TỰ
  </text>

  <rect x="20" y="50" width="910" height="40" fill="#1F2937"/>
  <rect x="20" y="90" width="910" height="70" fill="#FFFFFF"/>
  <rect x="20" y="160" width="910" height="70" fill="#F3F4F6"/>
  <rect x="20" y="230" width="910" height="90" fill="#FFFFFF"/>

  <rect x="20" y="50" width="910" height="270" fill="none" stroke="#D1D5DB" stroke-width="1"/>
  
  <line x1="180" y1="50" x2="180" y2="320" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="440" y1="50" x2="440" y2="320" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="690" y1="50" x2="690" y2="320" stroke="#D1D5DB" stroke-width="1"/>

  <text x="100" y="75" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Công cụ</text>
  <text x="310" y="75" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Phương pháp cốt lõi</text>
  <text x="565" y="75" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Khâu workflow giải quyết</text>
  <text x="800" y="75" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Khoảng trống (Gap)</text>

  <text x="100" y="125" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">Insights.gg</text>
  <text x="195" y="120" font-family="sans-serif" font-size="13" fill="#374151">Nhận diện màn hình, phần</text>
  <text x="195" y="140" font-family="sans-serif" font-size="13" fill="#374151">mềm tự động gắn thẻ sự kiện</text>
  <text x="455" y="120" font-family="sans-serif" font-size="13" fill="#047857">Cắt clip ngắn và trích xuất</text>
  <text x="455" y="140" font-family="sans-serif" font-size="13" fill="#047857">văn bản thao tác (Timestamp)</text>
  <text x="705" y="120" font-family="sans-serif" font-size="13" fill="#B91C1C">Chưa có khả năng suy luận</text>
  <text x="705" y="140" font-family="sans-serif" font-size="13" fill="#B91C1C">và lý giải hành vi chiến thuật</text>

  <text x="100" y="190" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">Mobalytics &amp;</text>
  <text x="100" y="210" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">iTero Gaming</text>
  <text x="195" y="190" font-family="sans-serif" font-size="13" fill="#374151">Kết nối API trò chơi, phân</text>
  <text x="195" y="210" font-family="sans-serif" font-size="13" fill="#374151">tích dữ liệu lớn &amp; chiến thuật</text>
  <text x="455" y="190" font-family="sans-serif" font-size="13" fill="#047857">Quét dữ liệu toàn trận và</text>
  <text x="455" y="210" font-family="sans-serif" font-size="13" fill="#047857">lập bản đồ các biến số</text>
  <text x="705" y="190" font-family="sans-serif" font-size="13" fill="#B91C1C">Phụ thuộc lớn vào API,</text>
  <text x="705" y="210" font-family="sans-serif" font-size="13" fill="#B91C1C">khó áp dụng với video tĩnh</text>

  <text x="100" y="265" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">Trophi.ai &amp;</text>
  <text x="100" y="285" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">Hakko AI</text>
  <text x="195" y="255" font-family="sans-serif" font-size="13" fill="#374151">Computer Vision (nhận diện</text>
  <text x="195" y="275" font-family="sans-serif" font-size="13" fill="#374151">hình ảnh) kết hợp Machine</text>
  <text x="195" y="295" font-family="sans-serif" font-size="13" fill="#374151">Learning đối chiếu lỗi</text>
  <text x="455" y="265" font-family="sans-serif" font-size="13" fill="#047857">Phân tích logic hành vi ở</text>
  <text x="455" y="285" font-family="sans-serif" font-size="13" fill="#047857">mức cơ bản (cảnh báo lỗi)</text>
  <text x="705" y="255" font-family="sans-serif" font-size="13" fill="#B91C1C">Thiếu suy luận ngược bối</text>
  <text x="705" y="275" font-family="sans-serif" font-size="13" fill="#B91C1C">cảnh sâu; chi phí xử lý tài</text>
  <text x="705" y="295" font-family="sans-serif" font-size="13" fill="#B91C1C">nguyên tính toán (GPU) cao</text>
</svg>
